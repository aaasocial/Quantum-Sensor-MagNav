[project]
name = "magnav"
version = "0.2.0"
description = "Quantum MagNav: GPS-denied UAV navigation with an emulated Ramsey/GHZ quantum magnetometer (Qollab x IonQ Hackathon)"
license = "MIT"
requires-python = ">=3.13,<3.15"
dependencies = [
    "qiskit>=2.5.2,<3.0.0",
    "numpy>=2.4,<2.5",
    "scipy>=1.18,<1.19",
]

[dependency-groups]
dev = [
    "qiskit-ionq==1.0.2",
    "pytest>=9.1",
    "ruff>=0.17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
